<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vision Player</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">GOOD CONNECTIONS</p>
      <h1>Vision player</h1>
      <p class="lede">Screenshots in. Three clicks out. No card labels or game state are read.</p>

      <label>
        Card selector
        <input id="selector" value=".card-btn" spellcheck="false" />
      </label>
      <div class="actions">
        <button id="scan">Scan board</button>
        <button id="play" class="primary" disabled>Play best</button>
      </div>
      <button id="auto" class="auto">Start guarded auto-play</button>

      <section class="result" aria-live="polite">
        <span id="status">Loading local Rust model…</span>
        <strong id="choice">—</strong>
        <small id="confidence"></small>
      </section>
      <p class="fineprint">Actions require two stable agreeing frames, calibrated decision diagnostics, and a verified pixel-level board change.</p>
    </main>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
